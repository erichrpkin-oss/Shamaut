name: Daily YouTube Short

on:
  schedule:
    # 09:00 UTC every day. Adjust to taste.
    - cron: "0 9 * * *"
  workflow_dispatch: {}

jobs:
  produce-and-upload:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run pipeline (generate + render + upload)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: npm run pipeline

      - name: Commit updated facts.json (marks the fact as used)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/facts.json
          git diff --cached --quiet || git commit -m "chore: mark fact as used [skip ci]"
          git push
